<!doctype html><html><body style="margin:0"><canvas id=c width=420 height=640></canvas>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const q = new URLSearchParams(location.search);
const name = q.get('m');
const PREFIX = 'mixamorig10'; // survivor.glb bone names: the animation clips target these
const manager = new THREE.LoadingManager();
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
r.outputColorSpace = THREE.SRGBColorSpace;
const s = new THREE.Scene(); s.background = new THREE.Color(0x9aa4ad);
s.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.0));
const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 4); s.add(d);
const cam = new THREE.PerspectiveCamera(30, 420 / 640, 1, 5000);
let obj;
manager.onLoad = () => setTimeout(go, 300);
new FBXLoader(manager).load('./fbx/' + name + '.fbx', (o) => { obj = o; });
function std(m) {
  const hair = /hair|lash|beard|brow/i.test(m.name);
  const n = new THREE.MeshStandardMaterial({
    name: m.name, map: m.map || null, normalMap: m.normalMap || null, color: m.map ? 0xffffff : m.color,
    roughness: hair ? 0.6 : 0.85, metalness: 0,
  });
  if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
  if (hair || m.alphaMap || m.transparent) { n.alphaTest = 0.5; n.side = THREE.DoubleSide; if (m.alphaMap) n.alphaMap = m.alphaMap; }
  return n;
}
async function go() {
  const info = { meshes: [], mats: [] };
  obj.animations = [];
  obj.traverse((x) => {
    if (x.isBone) x.name = x.name.replace(/^mixamorig\d*:?/, PREFIX);
    if (x.isMesh) {
      x.material = Array.isArray(x.material) ? x.material.map(std) : std(x.material);
      info.meshes.push(x.name);
      for (const m of [].concat(x.material)) info.mats.push(m.name + (m.map ? ' map' : '') + (m.normalMap ? ' nrm' : '') + (m.alphaMap ? ' alpha' : '') + (m.alphaTest ? ' cut' : ''));
    }
  });
  // remove the FBX's own scale/units: the hips' parent space is what the clips are authored in
  const box = new THREE.Box3().setFromObject(obj);
  info.h = box.max.y - box.min.y;
  const hips = obj.getObjectByName(PREFIX + 'Hips');
  info.hipsY = hips.position.y;
  obj.updateMatrixWorld(true);
  info.hipsWorldY = hips.getWorldPosition(new THREE.Vector3()).y;
  s.add(obj);
  cam.position.set(0, box.min.y + info.h * 0.55, info.h * 2.4); cam.lookAt(0, box.min.y + info.h * 0.5, 0);
  r.render(s, cam);
  if (q.has('export')) {
    const glb = await new GLTFExporter().parseAsync(obj, { binary: true, maxTextureSize: 1024, onlyVisible: true });
    const bytes = new Uint8Array(glb);
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    window.GLB = btoa(bin);
  }
  window.INFO = info; window.DONE = true;
}
</script></body></html>
